<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - IDS relay server</title>
    <th:block th:replace="~{components/head-imports}"></th:block>
</head>

<body class="root__container root__container--card">
    <div th:replace="~{components/alert}"></div>
    <div class="content__section">
        <fieldset class="fieldset-frame">
            <legend class="fieldset-frame__legend">IDS relay server</legend>
            <form action="/login" method="POST" class="vertical-form">
                <div class="vertical-form__control-container">
                    <label for="username" class="vertical-form__label">Username/login</label>
                    <input type="text" id="username" name="username" th:value="${username}">
                    <div class="alert__container alert__container--danger"
                        th:if="${formErrors != null and formErrors['username'] != null}">
                        <div class="alert__text alert__text--small" th:text="${formErrors['username']}"></div>
                    </div>
                </div>
                <div class="vertical-form__control-container">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                    <div class="alert__container alert__container--danger"
                        th:if="${formErrors != null and formErrors['password'] != null}">
                        <div class="alert__text alert__text--small" th:text="${formErrors['password']}"></div>
                    </div>
                </div>
                <button>Login</button>
            </form>
        </fieldset>
    </div>
    <div th:replace="~{components/footer}"></div>
</body>

</html>
